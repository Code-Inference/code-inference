name: Publish image
#
# Tag-based publishing with SemVer — image tags follow git tags.
#
#   Version strategy (adhere to Semantic Versioning 2.0.0):
#     PATCH (v1.0.0 → v1.0.1):  Bug fixes, refactors, docs, CI changes.
#     MINOR (v1.0.0 → v1.1.0):  New features, additions, non-breaking changes.
#     MAJOR (v1.0.0 → v2.0.0):  Breaking changes (API, config, interface).
#
#   Process (see docs/git-workflow.md §9):
#     1. Merge topic PR → development
#     2. Open release PR: development → main
#     3. Merge release PR
#     4. Tag on main: git tag -a vMAJOR.MINOR.PATCH -m "..."
#     5. Push tag:       git push origin vMAJOR.MINOR.PATCH
#
#   WARNING — this workflow triggers on `tags: ['v*']` for ANY branch. A
#   `vX.Y.Z-dev.N` integration tag on development would publish an image built
#   from an unreviewed commit. See docs/git-workflow.md §3.2 before adding one.
#
#   Image tags produced (note: no `v` prefix, metadata-action strips it):
#     1.6.0, 1.6, latest (main only), <short-sha>

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # One agent failing should not hide the others' results.
      fail-fast: false
      matrix:
        include:
          # opencode keeps the bare tags (1.7.2, 1.7, latest) so an existing
          # reference to the default agent image keeps resolving. The flavor is
          # stated per entry rather than computed: GitHub's `cond && '' || x`
          # returns x when the middle value is an empty string, because '' is
          # falsy, which silently suffixed opencode too in v1.7.1.
          - agent: opencode
            dockerfile: src/opencode-stack/Dockerfile
            flavor: ''
          - agent: claude
            dockerfile: src/claude-stack/Dockerfile
            flavor: 'suffix=-claude'
          - agent: cursor
            dockerfile: src/cursor-stack/Dockerfile
            flavor: 'suffix=-cursor'
          - agent: codex
            dockerfile: src/codex-stack/Dockerfile
            flavor: 'suffix=-codex'
          - agent: grok
            dockerfile: src/grok-stack/Dockerfile
            flavor: 'suffix=-grok'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        # Required for the type=gha cache below. Without a buildx builder the
        # default `docker` driver is used, and it cannot export cache, so every
        # build fails with "Cache export is not supported for the docker driver".
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: ${{ matrix.flavor }}
          # `latest` belongs to opencode and is written by that job alone.
          #
          # Gating on the agent as well as the ref is deliberate: with the ref
          # check alone, a tag push still emitted `latest` from every job, five
          # jobs raced on the one shared tag, and the last writer won — which is
          # how `latest` ended up pointing at the cursor image in v1.7.2. With
          # one writer there is no race, whatever the ref check does.
          #
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && matrix.agent == 'opencode' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.agent }}
          cache-to: type=gha,mode=max,scope=${{ matrix.agent }}