name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Shellcheck launcher scripts
        run: shellcheck -s sh start.sh restart.sh install.sh launch-*.sh scripts/*.sh
      - name: Agent templates in sync
        run: ./scripts/check-template-sync.sh
      - name: Agent volumes carry the agent name
        run: ./scripts/check-volume-naming.sh
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/services/api/requirements.txt -r dev-requirements.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy --config-file=pyproject.toml --no-strict-optional --ignore-missing-imports src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/services/api/requirements.txt
      - name: Run tests
        run: pytest -v
